<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal lost · Chandra Kiran Teja</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230C0D0F'/%3E%3Crect x='22' y='22' width='56' height='56' fill='none' stroke='%23E2A33E' stroke-width='7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0C0D0F;--panel-2:#0F1114;--line:#272B33;--line-2:#373C46;
    --ink:#EDEBE6;--body:#B8B6AF;--muted:#A49F94;--dim:#877F71;--sig:#E2A33E;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--body);
       font-family:"IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center;padding:32px}
  a{color:inherit;text-decoration:none}
  .frame{border:1px solid var(--line-2);background:var(--panel-2);padding:9px;max-width:540px;width:100%}
  .bar,.foot{display:flex;justify-content:space-between;gap:1rem;
             font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.06em;
             text-transform:uppercase;color:var(--dim)}
  .bar{padding:0 2px 9px}
  .foot{padding:9px 2px 0;border-top:1px solid var(--line);margin-top:9px}
  .foot b{color:var(--sig);font-weight:400}
  .rec{display:inline-flex;align-items:center;gap:.4rem;color:var(--sig)}
  .rec::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sig)}
  .stage{background:#000;padding:56px 30px;text-align:center;position:relative;overflow:hidden}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
  .code{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.16em;color:var(--sig);margin-bottom:1.1rem}
  h1{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:clamp(1.9rem,6vw,2.7rem);
     line-height:1.12;color:var(--ink);margin:0 0 .9rem;letter-spacing:-.02em}
  p{margin:0 auto;max-width:38ch;font-size:.98rem;line-height:1.65;color:var(--muted)}
  .cta{margin-top:1.7rem;display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
  .btn{font-family:"IBM Plex Mono",monospace;font-size:.78rem;padding:.68rem 1.1rem;border-radius:2px;
       border:1px solid var(--line-2);color:var(--ink);background:transparent;transition:border-color .18s,color .18s}
  .btn:hover{border-color:var(--sig);color:var(--sig)}
  .btn.solid{background:var(--sig);color:var(--ground);border-color:var(--sig)}
  .btn.solid:hover{opacity:.85;color:var(--ground)}
</style>
</head>
<body>
  <main class="frame">
    <div class="bar"><span>no-signal.jpg</span><span class="rec">00:00:00:00</span></div>
    <div class="stage">
      <div class="code">ERR 404 · NO DETECTION</div>
      <h1>Signal lost.</h1>
      <p>Nothing in this frame. The page you asked for isn't here. It may have been moved, or the link mistyped.</p>
      <div class="cta">
        <a class="btn solid" id="home" href="/Portfolio/">Back to the sequence</a>
        <a class="btn" href="mailto:chandrakiranteja@gmail.com">Email me</a>
      </div>
    </div>
    <div class="foot"><span>detections <b>0</b></span><span>track id <b>–</b></span></div>
  </main>
<script>
(function(){
  var a=document.getElementById('home'); if(!a) return;
  var p=location.pathname.split('/').filter(Boolean);
  a.href = p.length>1 ? '/'+p[0]+'/' : '/';
})();
</script>
</body>
</html>
