  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--body);
       font-family:"IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center;padding:32px}

  .foot{padding:9px 2px 0;border-top:1px solid var(--line);margin-top:9px}

  .btn{font-family:"IBM Plex Mono",monospace;font-size:.78rem;padding:.68rem 1.1rem;border-radius:2px;

<script>
(function(){
  var a=document.getElementById('home'); if(!a) return;
  var p=location.pathname.split('/').filter(Boolean);
  a.href = p.length>1 ? '/'+p[0]+'/' : '/';
})();
</script>
<script>
/* ---- analytics: cookieless, no personal data, no consent banner needed ----
   Set CODE to your GoatCounter code and nothing else needs changing. While it
   is empty this script loads nothing and makes no network request at all. */
(function(){
  var CODE = '';   /* e.g. 'ckteja' for https://ckteja.goatcounter.com */
  if(!CODE) return;

  var s=document.createElement('script');
  s.async=true;
  s.src='https://gc.zgo.at/count.js';
  s.setAttribute('data-goatcounter','https://'+CODE+'.goatcounter.com/count');
  document.body.appendChild(s);

  function ev(path,title){
    if(window.goatcounter&&window.goatcounter.count)
      window.goatcounter.count({path:path,title:title,event:true});
  }
  /* the three signals worth knowing about on a portfolio: did they take the CV,
     did they actually run the demo, and where did they go next */
  document.addEventListener('click',function(e){
    var el=e.target&&e.target.closest?e.target.closest('a[href],button'):null;
    if(!el) return;
    if(el.id==='dmRun'||el.id==='dmCam'||el.id==='dmPick') return ev('demo-run','Live demo used');
    var href=el.getAttribute('href')||'';
    if(/\.pdf($|\?|#)/i.test(href)) return ev('cv-download','CV download');
    if(/^https?:\/\//i.test(href)){
      try{
        var h=new URL(href,location.href).hostname.replace(/^www\./,'');
        if(h!==location.hostname) ev('out-'+h,'Outbound: '+h);
      }catch(err){}
    }
  },true);
})();
</script>
